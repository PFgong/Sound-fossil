<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标本册 · 声音化石</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="museum.css">
<script src="vendor/qrcode.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/three-addons/"
  }
}
</script>
</head>
<body>

<div id="filewarn" hidden style="max-width:720px;margin:60px auto;padding:28px 32px;background:#fff8e6;border:1px solid #d8c9a8;font-family:system-ui,'Microsoft YaHei',sans-serif;line-height:1.7">
  <b style="font-size:17px">请用本地服务打开，双击文件是打不开的</b>
  <p style="margin:14px 0 6px">浏览器不允许 <code>file://</code> 页面加载 ES 模块。在项目目录里执行：</p>
  <pre style="background:#f3ecd8;padding:10px 14px;margin:0 0 6px;font-family:ui-monospace,Consolas,monospace">python serve.py 8080</pre>
  <p style="margin:0">然后打开 <code>http://127.0.0.1:8080/museum.html</code></p>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (location.protocol !== 'file:') return;
    document.getElementById('filewarn').hidden = false;
    var app = document.getElementById('app');
    if (app) app.hidden = true;
  });
</script>

<header class="top">
  <div class="brand">标本册<span class="brand-en">THE SHELF</span></div>
  <nav>
    <a href="index.html">制作台</a>
    <a href="viewer.html">查看模型</a>
    <button id="btnAlbum">导出整册</button>
  </nav>
</header>

<main class="shelf-wrap">
  <p id="empty" class="muted">标本册还是空的。去制作台造第一枚化石。</p>
  <div class="shelf" id="shelf"></div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <canvas id="view"></canvas>
    <div class="modal-side">
      <span class="num" id="mNum"></span>
      <h2 id="mTitle"></h2>
      <dl class="kv" id="mMeta"></dl>
      <audio id="mAudio" controls></audio>
      <p id="mNote" class="muted small"></p>
      <div class="row">
        <button id="mClose">关闭</button>
        <button id="mDelete">删除这枚</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="src/museum-main.js"></script>
</body>
</html>
